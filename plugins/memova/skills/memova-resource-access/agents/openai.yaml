interface:
  display_name: "Memova Meeting & Spark Files"
  short_description: "Read complete Spark conversations and Meeting or Spark files."
  default_prompt: "Use $memova-resource-access to find my latest Spark and read every conversation message, or open a selected Meeting or Spark file."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "memova"
      description: "Authenticated Memova MCP Resource Access V1 for user-owned Meeting and Spark files."
      transport: "streamable_http"
      url: "https://api.memova.ai/mcp"
