name: Collector multiplatform synthetic soak

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "collector/**"
      - "collector/hooks/**"
  pull_request:
    paths:
      - "collector/**"
      - "collector/hooks/**"
  workflow_dispatch:
    inputs:
      cycles:
        description: Restart/idempotency cycles per native device
        required: true
        default: "12"

permissions:
  contents: read

jobs:
  collector-soak:
    name: ${{ matrix.device_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            device_id: linux-github-hosted
            test_profile: full
          - os: windows-latest
            device_id: windows-github-hosted
            test_profile: portability
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SOAK_CYCLES: ${{ inputs.cycles || '12' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux native credential-store dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-tools

      - name: Run bounded Collector tests
        shell: bash
        env:
          TEST_PROFILE: ${{ matrix.test_profile }}
        run: |
          export PYTHONPATH=collector
          if [ "$TEST_PROFILE" = "full" ]; then
            python -c 'import unittest; count=unittest.defaultTestLoader.discover("collector/tests").countTestCases(); print(f"collector_test_count={count}"); assert count <= 75'
            python -m unittest discover -s collector/tests -v
          else
            python -c 'import unittest; patterns=["test_cli.py", "test_contracts.py", "test_hook.py", "test_installer.py", "test_locking.py", "test_multiplatform_soak.py", "test_scheduler.py"]; count=sum(unittest.defaultTestLoader.discover("collector/tests", pattern=pattern).countTestCases() for pattern in patterns); print(f"collector_portability_test_count={count}"); assert count <= 25'
            for pattern in test_cli.py test_contracts.py test_hook.py test_installer.py test_locking.py test_multiplatform_soak.py test_scheduler.py; do
              python -m unittest discover -s collector/tests -p "$pattern" -v
            done
          fi
          python -m compileall -q collector

      - name: Run native Windows restart soak
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHONPATH = "collector"
          python collector/scripts/run_multiplatform_soak.py --cycles "$env:SOAK_CYCLES" --interval-seconds 1 --device-id "${{ matrix.device_id }}"

      - name: Run native Linux restart soak with Secret Service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            export PYTHONPATH=collector
            printf %s "temporary-runner-keyring" | gnome-keyring-daemon --unlock >/dev/null
            python collector/scripts/run_multiplatform_soak.py \
              --cycles "$SOAK_CYCLES" \
              --interval-seconds 1 \
              --device-id "${{ matrix.device_id }}"
          '
